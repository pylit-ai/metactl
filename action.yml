name: metactl check
description: Install a verified metactl release and run an agent-safe drift check.
inputs:
  version:
    description: Release tag to install, or latest.
    required: false
    default: latest
  args:
    description: metactl command and arguments to run. --agent is added when omitted.
    required: false
    default: check --agent
  project-path:
    description: Project directory to validate.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install metactl
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        METACTL_ACTION_PATH: ${{ github.action_path }}
        METACTL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) target=x86_64-unknown-linux-gnu ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          *) echo "No prebuilt metactl release for ${RUNNER_OS}/${RUNNER_ARCH}; using Cargo."; cargo install metactl --locked; echo "bin=$(command -v metactl)" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac
        if [ "$METACTL_VERSION" = latest ]; then
          tag="$(curl --fail --silent --show-error https://api.github.com/repos/pylit-ai/metactl/releases/latest | jq -r .tag_name)"
        else
          tag="$METACTL_VERSION"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
        fi
        archive="metactl-${tag}-${target}.tar.gz"
        base="https://github.com/pylit-ai/metactl/releases/download/${tag}"
        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT
        if curl --fail --location --silent --show-error --output "$workdir/$archive" "$base/$archive" && \
           curl --fail --location --silent --show-error --output "$workdir/$archive.sha256" "$base/$archive.sha256"; then
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$workdir" && sha256sum -c "$archive.sha256")
          else
            (cd "$workdir" && shasum -a 256 -c "$archive.sha256")
          fi
          "$METACTL_ACTION_PATH/scripts/verify_github_attestation.sh" "$workdir/$archive"
          tar -xzf "$workdir/$archive" -C "$workdir"
          install -m 0755 "$workdir/${archive%.tar.gz}/metactl" "$RUNNER_TEMP/metactl"
          echo "bin=$RUNNER_TEMP/metactl" >> "$GITHUB_OUTPUT"
        else
          echo "Prebuilt release unavailable; falling back to cargo install --locked."
          cargo install metactl --locked
          echo "bin=$(command -v metactl)" >> "$GITHUB_OUTPUT"
        fi
    - name: Run drift gate
      shell: bash
      env:
        METACTL_BIN: ${{ steps.install.outputs.bin }}
        METACTL_ARGS: ${{ inputs.args }}
        METACTL_PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        set -euo pipefail
        read -r -a args <<< "$METACTL_ARGS"
        has_agent=false
        for arg in "${args[@]}"; do [ "$arg" = --agent ] && has_agent=true; done
        if [ "$has_agent" = false ]; then
          args+=(--agent)
        fi
        set +e
        "$METACTL_BIN" --project "$METACTL_PROJECT_PATH" "${args[@]}" | tee "$RUNNER_TEMP/metactl.json"
        metactl_exit=${PIPESTATUS[0]}
        set -e
        {
          echo "## metactl drift gate"
          echo
          echo '```json'
          jq '{ok, next_commands}' "$RUNNER_TEMP/metactl.json" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$metactl_exit"
