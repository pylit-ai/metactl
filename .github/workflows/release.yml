name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Ensure public-boundary scanner
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                sudo apt-get update
                sudo apt-get install -y ripgrep
                ;;
              macOS) brew install ripgrep ;;
              *) echo "Unsupported scanner installation platform: $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi
          rg --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify
        run: |
          cargo fmt --check
          cargo check -p metactl -p metactld
          cargo test -p metactl
          make verify-v1-release-gate
          make metactl-validate-contracts
          make verify-public-boundary
      - name: Package crates
        run: |
          cargo package -p metactl --locked
          # metactld depends on the published metactl crate version, so it
          # cannot be packaged against crates.io until metactl reaches the index.
          # The binary still builds below; crate publish verification is
          # dependency-ordered in docs/release-readiness.md.
      - name: Build release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}" -p metactl -p metactld
      - name: Assemble archive
        shell: bash
        run: |
          python3 scripts/package_release.py --target "${{ matrix.target }}" --binary-dir "target/${{ matrix.target }}/release"
      - name: Smoke assembled archive outside the source checkout
        shell: bash
        run: |
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("crates/metactl/Cargo.toml").read_text())["package"]["version"])')
          python3 scripts/smoke_release_archive.py "dist/metactl-v${version}-${{ matrix.target }}.tar.gz" --version "$version"
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Draft release. Verify checksums and support matrix before publishing."
