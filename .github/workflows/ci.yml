name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-ignore:
    name: Windows ignore safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows source build
        run: cargo check --locked -p metactl -p metactld
      - name: Exercise Windows ignore publication and recovery
        run: cargo test --locked -p metactl --test ignore_platform -- --nocapture
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check -p metactl -p metactld
      - name: Test
        run: cargo test -p metactl
      - name: Validate contracts
        run: make metactl-validate-contracts
      - name: V1 release gate
        run: make verify-v1-release-gate
      - name: Public boundary
        run: bash scripts/check_public_boundary.sh
